<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 지니 4 (Genie 4) 월드 시뮬레이터 체험관 | CONNECT AI LAB 4기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .ui-overlay {
            position: absolute;
            top: 20px; left: 24px;
            z-index: 10;
            max-width: 440px;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 16px;
        }
        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        button {
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button:hover {
            background: #334155;
            border-color: #38bdf8;
            transform: translateY(-2px);
            color: #38bdf8;
        }
        button.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .genie-stepper {
            display: flex;
            gap: 4px;
            background: #0f172a;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .step-btn {
            flex: 1;
            padding: 6px 4px;
            font-size: 0.75rem;
            border-radius: 6px;
            background: transparent;
            border: none;
            color: #94a3b8;
        }
        .step-btn.active {
            background: #2563eb;
            color: #fff;
            box-shadow: none;
        }
        .info-card {
            background: rgba(30, 41, 59, 0.6);
            border-left: 3px solid #38bdf8;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #cbd5e1;
        }
        .bottom-bar {
            position: absolute;
            bottom: 20px; right: 24px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .sound-indicator {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 6px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <h1>🌐 구글 지니 4 월드 시뮬레이터</h1>
        <div class="subtitle">
            <strong>"말 한마디로 세상을 바꾼다"</strong><br>
            Genie 1부터 4까지의 진화 원리와 물리·음향 시뮬레이션을 직접 조작해 보세요.
        </div>

        <div class="section-label">지니 진화 단계 (Genie Evolution)</div>
        <div class="genie-stepper">
            <button class="step-btn" onclick="setGenieStep(1)">Genie 1 (2D)</button>
            <button class="step-btn" onclick="setGenieStep(2)">Genie 2 (3D)</button>
            <button class="step-btn" onclick="setGenieStep(3)">Genie 3 (Live)</button>
            <button class="step-btn active" onclick="setGenieStep(4)">Genie 4 (물리+소리)</button>
        </div>

        <div id="step-desc" class="info-card" style="margin-bottom: 16px;">
            <strong>Genie 4 (최신):</strong> 3D 공간 + 물리 법칙($F=ma$) + 충돌 진동 <strong>소리(Sound)</strong>까지 실시간 동시 생성!
        </div>

        <div class="section-label">실시간 프롬프트 명령 (환경 조작)</div>
        <div class="button-group">
            <button id="btn-sun" class="active" onclick="setWeather('sunny')">☀️ 맑음 (햇빛 비춰줘)</button>
            <button id="btn-rain" onclick="setWeather('rain')">🌧️ 비 내려줘 (소리 생성)</button>
            <button id="btn-snow" onclick="setWeather('snow')">❄️ 눈 내려줘</button>
            <button id="btn-night" onclick="toggleNight()">🌙 밤 / 낮 전환</button>
        </div>

        <div class="section-label">물리 객체 소환 (MuJoCo 8강 연동)</div>
        <div class="button-group">
            <button onclick="spawnBall('basketball')">🏀 농구공 낙하 (0.62kg)</button>
            <button onclick="spawnBall('steel')">⚙️ 1,000톤 쇠공 낙하</button>
            <button onclick="spawnBall('titanium')">🤖 100kg 티타늄 주행구</button>
            <button onclick="resetScene()">🔄 시뮬레이터 초기화</button>
        </div>
    </div>

    <div class="bottom-bar">
        <span class="sound-indicator"></span> 마우스 좌클릭(3D 회전) · 우클릭(이동) · 휠(줌) | CONNECT AI LAB
    </div>

    <script>
        // Web Audio API for synthetic sound effects (Genie 4 sound synthesis)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Play synthetic rain noise
        let rainAudioNode = null;
        function playRainSound(enable) {
            initAudio();
            if (enable) {
                if (rainAudioNode) return;
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1; // White noise
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 800;

                const gain = audioCtx.createGain();
                gain.gain.value = 0.15;

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
                rainAudioNode = { source: noise, gain: gain };
            } else {
                if (rainAudioNode) {
                    rainAudioNode.gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    setTimeout(() => {
                        rainAudioNode.source.stop();
                        rainAudioNode = null;
                    }, 500);
                }
            }
        }

        // Play bounce thud sound
        function playBounceSound(pitch = 300, duration = 0.15, volume = 0.3) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + duration);

            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // Three.js Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a1128);
        scene.fog = new THREE.FogExp2(0x0a1128, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff3d6, 1.2);
        sunLight.position.set(15, 25, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // Ground Plane (Arena Grid)
        const gridHelper = new THREE.GridHelper(30, 30, 0x38bdf8, 0x1e293b);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        const floorGeo = new THREE.PlaneGeometry(30, 30);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7, metalness: 0.1 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Target Portal (From Lecture 8 Ball Arena)
        const targetGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.1, 32);
        const targetMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x059669, emissiveIntensity: 0.5 });
        const targetPortal = new THREE.Mesh(targetGeo, targetMat);
        targetPortal.position.set(5, 0.05, -5);
        scene.add(targetPortal);

        // Target Light Beam
        const beamGeo = new THREE.CylinderGeometry(0.1, 0.1, 12, 16);
        const beamMat = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.4 });
        const beam = new THREE.Mesh(beamGeo, beamMat);
        beam.position.set(5, 6, -5);
        scene.add(beam);

        // Particles (Rain / Snow)
        let particleSystem = null;
        let particleMode = 'none';

        function createWeatherParticles(type) {
            if (particleSystem) {
                scene.remove(particleSystem);
                particleSystem = null;
            }
            particleMode = type;

            if (type === 'none') {
                playRainSound(false);
                return;
            }

            const count = type === 'rain' ? 3000 : 1500;
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 40;
                positions[i * 3 + 1] = Math.random() * 25;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 40;
                velocities.push(type === 'rain' ? -0.4 - Math.random() * 0.3 : -0.05 - Math.random() * 0.05);
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.userData = { velocities };

            const color = type === 'rain' ? 0x93c5fd : 0xffffff;
            const size = type === 'rain' ? 0.12 : 0.22;
            const mat = new THREE.PointsMaterial({
                color: color,
                size: size,
                transparent: true,
                opacity: 0.7,
            });

            particleSystem = new THREE.Points(geo, mat);
            scene.add(particleSystem);

            if (type === 'rain') {
                playRainSound(true);
            } else {
                playRainSound(false);
            }
        }

        // Active Physics Objects
        const balls = [];

        function spawnBall(type) {
            initAudio();
            let radius, color, mass, bounciness, pitch;

            if (type === 'basketball') {
                radius = 0.4;
                color = 0xf97316; // Orange
                mass = 0.62;
                bounciness = 0.82;
                pitch = 280;
            } else if (type === 'steel') {
                radius = 0.6;
                color = 0x64748b; // Steel Dark
                mass = 1000;
                bounciness = 0.05; // Almost no bounce
                pitch = 90;
            } else {
                // Titanium Autonomous Agent
                radius = 0.5;
                color = 0x38bdf8; // Neon Cyan
                mass = 100;
                bounciness = 0.4;
                pitch = 180;
            }

            const geo = new THREE.SphereGeometry(radius, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                metalness: type === 'steel' || type === 'titanium' ? 0.8 : 0.1,
                roughness: type === 'basketball' ? 0.6 : 0.2,
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.position.set((Math.random() - 0.5) * 6 - 3, 8, (Math.random() - 0.5) * 6 + 3);
            scene.add(mesh);

            balls.push({
                mesh: mesh,
                type: type,
                radius: radius,
                vy: 0,
                vx: type === 'titanium' ? (Math.random() - 0.5) * 0.05 : 0,
                vz: type === 'titanium' ? (Math.random() - 0.5) * 0.05 : 0,
                gravity: -0.015,
                bounciness: bounciness,
                pitch: pitch,
                mass: mass,
            });
        }

        function resetScene() {
            balls.forEach(b => scene.remove(b.mesh));
            balls.length = 0;
            setWeather('sunny');
        }

        function setWeather(w) {
            document.querySelectorAll('.button-group button').forEach(b => b.classList.remove('active'));
            if (w === 'sunny') {
                document.getElementById('btn-sun').classList.add('active');
                scene.background = new THREE.Color(0x0a1128);
                scene.fog.color = new THREE.Color(0x0a1128);
                sunLight.intensity = 1.2;
                createWeatherParticles('none');
            } else if (w === 'rain') {
                document.getElementById('btn-rain').classList.add('active');
                scene.background = new THREE.Color(0x050a14);
                scene.fog.color = new THREE.Color(0x050a14);
                sunLight.intensity = 0.4;
                createWeatherParticles('rain');
            } else if (w === 'snow') {
                document.getElementById('btn-snow').classList.add('active');
                scene.background = new THREE.Color(0x111827);
                scene.fog.color = new THREE.Color(0x111827);
                sunLight.intensity = 0.7;
                createWeatherParticles('snow');
            }
        }

        let isNight = false;
        function toggleNight() {
            isNight = !isNight;
            const btn = document.getElementById('btn-night');
            if (isNight) {
                btn.classList.add('active');
                scene.background = new THREE.Color(0x020617);
                ambientLight.intensity = 0.15;
                sunLight.intensity = 0.2;
            } else {
                btn.classList.remove('active');
                scene.background = new THREE.Color(0x0a1128);
                ambientLight.intensity = 0.4;
                sunLight.intensity = 1.2;
            }
        }

        function setGenieStep(step) {
            document.querySelectorAll('.genie-stepper button').forEach((b, i) => {
                b.classList.toggle('active', i + 1 === step);
            });
            const desc = document.getElementById('step-desc');
            if (step === 1) {
                desc.innerHTML = `<strong>Genie 1 (2024년 2월):</strong> 버튼 조작 데이터 없이 영상 화면 변화만 학습하여, 사진 1장으로 조작 가능한 <strong>2D 플랫포머 게임</strong> 생성.`;
                camera.position.set(0, 0, 16);
            } else if (step === 2) {
                desc.innerHTML = `<strong>Genie 2 (3D 혁명):</strong> 2D 평면을 넘어 입체 <strong>3D 가상 세계</strong>를 1장으로 생성. 단, 1분이 지나면 지형을 잊어버려 세상이 무너지는 한계.`;
                camera.position.set(0, 6, 14);
            } else if (step === 3) {
                desc.innerHTML = `<strong>Genie 3 (라이브 무한 생성):</strong> Gemini Omni 물리 모델 탑재. 프롬프트로 "햇빛 비춰줘", "날씨 바꿔줘" 하면 세상이 무너지지 않고 라이브로 무한 생성.`;
                camera.position.set(0, 8, 16);
            } else if (step === 4) {
                desc.innerHTML = `<strong>Genie 4 (물리 + 소리):</strong> 3D 공간 + 물리 법칙($F=ma$) + 충돌 진동 <strong>소리(Sound)</strong>까지 실시간 동시 생성! 최대 2분 일관성 유지.`;
                camera.position.set(0, 8, 16);
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Weather Particles
            if (particleSystem) {
                const pos = particleSystem.geometry.attributes.position.array;
                const vels = particleSystem.geometry.userData.velocities;
                for (let i = 0; i < vels.length; i++) {
                    pos[i * 3 + 1] += vels[i];
                    if (pos[i * 3 + 1] < 0) {
                        pos[i * 3 + 1] = 25;
                    }
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            // Ball Physics
            balls.forEach(b => {
                b.vy += b.gravity;
                b.mesh.position.y += b.vy;
                b.mesh.position.x += b.vx;
                b.mesh.position.z += b.vz;

                // Ground Bounce
                if (b.mesh.position.y <= b.radius) {
                    b.mesh.position.y = b.radius;
                    if (Math.abs(b.vy) > 0.05) {
                        playBounceSound(b.pitch, b.mass > 500 ? 0.3 : 0.12, b.mass > 500 ? 0.6 : 0.25);
                    }
                    b.vy = -b.vy * b.bounciness;

                    // Titanium Agent seeks the green target
                    if (b.type === 'titanium') {
                        const targetX = 5, targetZ = -5;
                        const dx = targetX - b.mesh.position.x;
                        const dz = targetZ - b.mesh.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        if (dist > 0.5) {
                            b.vx = (dx / dist) * 0.06;
                            b.vz = (dz / dist) * 0.06;
                        } else {
                            b.vx = 0;
                            b.vz = 0;
                        }
                    }
                }
            });

            // Target beam pulse
            beam.rotation.y += 0.01;
            targetPortal.rotation.y += 0.005;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
